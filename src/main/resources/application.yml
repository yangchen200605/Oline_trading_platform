server:
  port: 8080

spring:
  application:
    name: oline-trading-platform

  # MySQL 数据源（需在 pom 中引入 mysql + mybatis-plus 后才会生效）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/trading_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms

  # RabbitMQ（当前 pom 已引入，暂未使用可先保留）
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus（引入依赖后生效）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 自定义业务配置
oline:
  jwt:
    # 管理端员工 JWT
    admin-secret-key: oline-admin-secret-key-change-me-32b
    admin-ttl: 7200000
    admin-token-name: token
    # 用户端 JWT
    user-secret-key: oline-user-secret-key-change-me
    user-ttl: 7200000
    user-token-name: authentication
  # 阿里云 OSS（后续上传图片用，按实际账号填写）
  alioss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: your-bucket-name

# 日志
logging:
  level:
    com.atguigu.oline_trading_platform: debug
    org.springframework: info
